site_name: DiceModders

repo_url: https://github.com/DiceModders/DiceKingdoms-Modding-Wiki

theme:
  name: shadcn
  show_title: true
  show_stargazers: true
  hide_source_files: false
  pygments_style: 
        light: shadcn-light
        dark: github-dark
  icon: lucide:dice-6
  topbar_sections: false 
  show_datetime: false 
  features:
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - pymdownx.blocks.tab
  - codehilite
  - admonition
  - pymdownx.superfences:
      css_class: codehilite

nav:
  - DiceModders: index.md
  - Guides:
    - Mods Installation: guides/mod-installation.md
    - Modding: 
      - Project Setup: guides/modding/project-setup.md
      - IL2CPP Tips: guides/modding/il2cpp-tips.md
      - Hook Recipes: guides/modding/hook-recipes.md
      - Custom Models: guides/modding/custom-models.md
      - Making a Civilization: guides/modding/making-a-civilization.md
      - Publishing a Mod: guides/modding/publishing.md
  - Game architecture:
    - Overview: game-architecture/overview.md
    - Gameplay:
      - Turn Loop and Phases: game-architecture/turn-phases.md
      - Harvest and Dice: game-architecture/harvest.md
      - Disasters: game-architecture/disasters.md
      - Meteorites: game-architecture/meteorites.md
      - Build Phase: game-architecture/build-phase.md
      - Combat: game-architecture/combat.md
      - Win Conditions: game-architecture/win-conditions.md
      - AI: game-architecture/ai.md
      - Game Data: game-architecture/game-data.md
    - Island:
      - Grid: game-architecture/island/grid.md
      - Generation: game-architecture/island/generation.md
      - Save Format: game-architecture/island/save-format.md
    - Resources: game-architecture/resources.md
    - Buildings: game-architecture/buildings.md
    - Civilizations:
      - Rules and Civilizations: game-architecture/rules-and-civilizations.md
      - Civilizations in the Game Code: game-architecture/civilizations.md
      - Civilization Models and Sprites: game-architecture/civilization-assets.md
    - Multiplayer:
      - Networking: game-architecture/networking.md
      - Lobby, Menus and Steam: game-architecture/lobby-and-steam.md
    - Presentation:
      - Game UI: game-architecture/ui.md
      - Interface Behaviour: game-architecture/interface.md
      - Rendering and Visuals: game-architecture/rendering.md
      - Audio, Settings and Localization: game-architecture/audio-settings-localization.md
    - Developer Console: game-architecture/dev-console.md
    - Reverse-Engineering Notes: game-architecture/reverse-engineering.md
  - Reference:
    - Internals Reference: reference/internals.md
