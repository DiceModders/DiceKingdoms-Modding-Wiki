site_name: DiceModders

repo_url: https://github.com/DiceModders/DiceKingdoms-Modding-Wiki

theme:
  name: shadcn
  show_title: true
  show_stargazers: true
  hide_source_files: false
  pygments_style: 
        light: shadcn-light
        dark: github-dark
  icon: lucide:dice-6
  topbar_sections: false 
  show_datetime: false 
  features:
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - pymdownx.blocks.tab
  - codehilite
  - admonition
  - pymdownx.superfences:
      css_class: codehilite

nav:
  - DiceModders: index.md
  - Guides:
    - Mods Installation: guides/mod-installation.md
    - Modding: 
      - Project Setup: guides/modding/project-setup.md
  - Game architecture:
    - Island Generation: game-architecture/island-generation.md
    - Resources: game-architecture/resources.md
    - Island Save Format: game-architecture/island-save-format.md
    - Island Grid: game-architecture/island-grid.md
    - Buildings: game-architecture/buildings.md
  - Reference:
    - Internals Reference: reference/internals.md